[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "functional-stability-theory"
version = "1.0.0"
description = "Unified mathematical programme identifying Functional Positivity under Gauge Constraint (Pattern A) as common substrate across mathematics, physics, and cosmology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "Lukas Geiger" }
]
keywords = [
    "functional-stability-theory",
    "rfep",
    "pattern-a",
    "riemann-hypothesis",
    "connes-consani-moscovici",
    "zeta-zoo",
    "sge-taxonomy",
    "mathematical-physics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: Free For Educational Use",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/research-line/functional-stability-theory"
Documentation = "https://github.com/research-line/functional-stability-theory#readme"
Repository = "https://github.com/research-line/functional-stability-theory"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
