[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "functional-stability-theory"
version = "1.0.6"
description = "Unified mathematical programme identifying Functional Positivity under Gauge Constraint (Pattern A) as common substrate across mathematics, physics, and cosmology"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [
    { name = "Lukas Geiger" }
]
keywords = [
    "cosmology",
    "functional-analysis",
    "functional-stability-theory",
    "latex",
    "mathematical-physics",
    "mathematics",
    "millennium-problems",
    "open-science",
    "pde",
    "physics",
    "preprint",
    "renormalized-free-energy",
    "reproducible-research",
    "research",
    "research-software",
    "rfep",
    "riemann-hypothesis",
    "stability",
    "zenodo",
    "zenodo-doi"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: Free For Educational Use",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/research-line/functional-stability-theory"
Documentation = "https://github.com/research-line/functional-stability-theory#readme"
Repository = "https://github.com/research-line/functional-stability-theory"
Issues = "https://github.com/research-line/functional-stability-theory/issues"
Changelog = "https://github.com/research-line/functional-stability-theory/blob/main/CHANGELOG.md"
Security = "https://github.com/research-line/functional-stability-theory/blob/main/SECURITY.md"
Contributing = "https://github.com/research-line/functional-stability-theory/blob/main/CONTRIBUTING.md"
"Parent Organization" = "https://github.com/research-line"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/research-line/functional-stability-theory/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/research-line/functional-stability-theory/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/research-line/functional-stability-theory/blob/main/THIRD_PARTY_LICENSES.md#5-governance--research-invariant-compliance"
"Level 1 SBOM (Text)" = "https://github.com/research-line/functional-stability-theory/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/research-line/functional-stability-theory/blob/main/THIRD_PARTY_LICENSES.txt"
Notice = "https://github.com/research-line/functional-stability-theory/blob/main/NOTICE"
"Marketing Log" = "https://github.com/research-line/functional-stability-theory/blob/main/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/research-line/functional-stability-theory/blob/main/llms.txt"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".pytest_temp",
    ".hypothesis",
    "__pycache__",
    "build",
    "dist",
    "applications",
    "fst-biology",
    "fst-chemistry",
    "fst-cosmology",
    "fst-mathematics",
    "fst-physics",
    "masters",
    "scripts",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "applications",
    "fst-biology",
    "fst-chemistry",
    "fst-cosmology",
    "fst-mathematics",
    "fst-physics",
    "masters",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

